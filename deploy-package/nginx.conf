
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # HTTP -> HTTPS Redirect
    server {
        listen       80;
        server_name  www.sq-fy.cn sq-fy.cn 43.138.188.183;

        # 静态文件直接返回（robots.txt, sitemap.xml）
        location = /robots.txt {
            root   D:/sqfy-panel/client/dist;
            try_files $uri =404;
        }

        location = /sitemap.xml {
            root   D:/sqfy-panel/client/dist;
            try_files $uri =404;
        }

        # 其他所有请求重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen       443 ssl;
        server_name  www.sq-fy.cn sq-fy.cn;

        # SSL Configuration
        ssl_certificate      C:/nginx-1.24.0/ssl/fullchain.pem;
        ssl_certificate_key  C:/nginx-1.24.0/ssl/privkey.pem;

        # SSL 安全设置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Frontend Static Files with Cache
        location /assets/ {
            root   D:/sqfy-panel/client/dist;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # robots.txt / sitemap
        location = /robots.txt {
            root   D:/sqfy-panel/client/dist;
            try_files $uri =404;
        }

        location = /sitemap.xml {
            root   D:/sqfy-panel/client/dist;
            try_files $uri =404;
        }

        # Management Panel subdirectory
        location /mb/ {
            alias   D:/sqfy-panel/client/dist/;
            index  index.html index.htm;
            try_files $uri $uri/ /mb/index.html;
        }

        # SPA Fallback (其他路径)
        location / {
            root   D:/sqfy-panel/client/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Backend API Proxy
        location /api {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO Proxy
        location /socket.io {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
