<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/FYlogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squad Panel</title>
  </head>
  <body style="background-color: #0b0c10; margin: 0;">
    <div id="global-error" style="color: red; padding: 20px; display: none;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var errorDiv = document.getElementById('global-error');
        errorDiv.style.display = 'block';
        errorDiv.innerHTML += '<p>Error: ' + message + ' at ' + source + ':' + lineno + '</p>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errorDiv = document.getElementById('global-error');
        errorDiv.style.display = 'block';
        errorDiv.innerHTML += '<p>Unhandled Rejection: ' + event.reason + '</p>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
